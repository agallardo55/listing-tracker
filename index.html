<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#73d2bd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Traphouse exact tokens ── */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-rgb: 255,255,255;
    --surface-2: #F6F4FA;          /* Traphouse sidebar bg */
    --sidebar-bg: #F6F4FA;
    --sidebar-border: #E9E5F2;
    --sidebar-active: #EDE6F9;     /* Traphouse active nav fill */
    --text: #232338;               /* Traphouse --ink */
    --muted: #8C8A9B;              /* Traphouse --muted */
    --nav-text: #5C5A6E;           /* Traphouse inactive nav text */
    --border: #EDEAF3;             /* Traphouse --line */
    --radius: 14px;
    --shadow: 0 1px 3px rgba(35,35,56,0.04), 0 2px 8px rgba(35,35,56,0.06);
    --card-shadow: 0 1px 3px rgba(35,35,56,0.04);

    /* Accent — Traphouse purple */
    --accent: #7C5FC4;
    --accent-soft: #EAE1F6;
    --brand: #232338;              /* brand title = dark ink, like Traphouse */

    /* Traphouse semantic palette */
    --teal: #2E9C8E;    --teal-bg: #DCEEE8;
    --coral: #E85D46;   --coral-bg: #FBDCD6;
    --purple: #8A5FC9;  --purple-bg: #EAE1F6;
    --gold: #E3A53C;    --gold-bg: #FCF1D4;
    --blue: #4A86E8;    --blue-bg: #DFEAFC;

    /* Aliases for existing component references */
    --green: #DCEEE8;   --green-strong: #2E9C8E;
    --yellow: #FCF1D4;  --yellow-strong: #E3A53C;
    --red: #FBDCD6;     --red-strong: #E85D46;
    --blue-soft: #DFEAFC; --blue-strong: #4A86E8;
    --red-soft: #FBDCD6;
    --yellow-soft: #FCF1D4;

    /* Pastel row tints — Traphouse palette */
    --pastel-green: #DCEEE8;
    --pastel-blue: #DFEAFC;
    --pastel-yellow: #FCF1D4;
    --pastel-pink: #FBDCD6;
    --pastel-purple: #EAE1F6;

    --heading: #232338;
    --tile-text: #232338;
    --row-text: #232338;
    --control-overlay: rgba(255,255,255,.62);
    --progress-bg: rgba(255,255,255,.55);
    --progress-fill: rgba(35,35,56,.55);
    --page-gradient-top: #FFFFFF;
    --page-gradient-mid: #FAFAFA;
    --page-gradient-bottom: #F6F4FA;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #18162C; --surface: #211E38; --surface-rgb: 33,30,56;
      --surface-2: #2A2645; --sidebar-bg: #1C1A30; --sidebar-border: #2A2645;
      --sidebar-active: #2E2752;
      --text: #F0EEF8; --muted: #9896B0; --nav-text: #9896B0; --border: #2E2B4A;
      --accent: #9D82DE; --accent-soft: #2E2752; --brand: #F0EEF8;
      --teal-bg: #1E3630; --coral-bg: #321E1A; --purple-bg: #2E2752; --gold-bg: #332A16; --blue-bg: #1A253A;
      --green: #1E3630; --green-strong: #5DC8B8;
      --yellow: #332A16; --yellow-strong: #E3A53C;
      --red: #321E1A; --red-strong: #F07060;
      --blue-soft: #1A253A; --blue-strong: #6A9EF0;
      --red-soft: #321E1A; --yellow-soft: #332A16;
      --pastel-green: #1E3630; --pastel-blue: #1A253A;
      --pastel-yellow: #332A16; --pastel-pink: #321E1A; --pastel-purple: #2E2752;
      --heading: #F0EEF8; --tile-text: #F0EEF8; --row-text: #F0EEF8;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.4);
      --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
      --control-overlay: rgba(255,255,255,.14);
      --progress-bg: rgba(255,255,255,.18); --progress-fill: rgba(255,255,255,.62);
      --page-gradient-top: #18162C; --page-gradient-mid: #1C1A30; --page-gradient-bottom: #18162C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #18162C; --surface: #211E38; --surface-rgb: 33,30,56;
    --surface-2: #2A2645; --sidebar-bg: #1C1A30; --sidebar-border: #2A2645;
    --sidebar-active: #2E2752;
    --text: #F0EEF8; --muted: #9896B0; --nav-text: #9896B0; --border: #2E2B4A;
    --accent: #9D82DE; --accent-soft: #2E2752; --brand: #F0EEF8;
    --teal-bg: #1E3630; --coral-bg: #321E1A; --purple-bg: #2E2752; --gold-bg: #332A16; --blue-bg: #1A253A;
    --green: #1E3630; --green-strong: #5DC8B8;
    --yellow: #332A16; --yellow-strong: #E3A53C;
    --red: #321E1A; --red-strong: #F07060;
    --blue-soft: #1A253A; --blue-strong: #6A9EF0;
    --red-soft: #321E1A; --yellow-soft: #332A16;
    --pastel-green: #1E3630; --pastel-blue: #1A253A;
    --pastel-yellow: #332A16; --pastel-pink: #321E1A; --pastel-purple: #2E2752;
    --heading: #F0EEF8; --tile-text: #F0EEF8; --row-text: #F0EEF8;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.4);
    --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
    --control-overlay: rgba(255,255,255,.14);
    --progress-bg: rgba(255,255,255,.18); --progress-fill: rgba(255,255,255,.62);
    --page-gradient-top: #18162C; --page-gradient-mid: #1C1A30; --page-gradient-bottom: #18162C;
  }


  :root[data-theme="dark"] .promo-bar {
    background: linear-gradient(90deg, rgba(157,130,222,.25), rgba(74,134,232,.18), rgba(227,165,60,.20));
  }
  :root[data-theme="dark"] .topbar,
  :root[data-theme="dark"] .mobile-bottom-tabs { background: var(--surface); }
  :root[data-theme="dark"] .card { background: var(--surface); }
  :root[data-theme="dark"] .listing-sub { color: var(--muted); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; }
  #app { max-width: none; margin: 0; padding: 0; position: relative; }

  /* ======= Sidebar Navigation Layout ======= */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 230px; flex-shrink: 0; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column;
    padding: 22px 14px; z-index: 30;
    transition: transform 0.22s ease;
  }
  .sidebar-brand {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px; font-weight: 600; letter-spacing: .01em;
    padding: 4px 10px 18px; color: var(--text); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-brand-name-input {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px; font-weight: 600; letter-spacing: .01em;
    background: transparent; border: none; color: var(--text);
    border-bottom: 1px dashed transparent; padding: 0;
    min-width: 80px; max-width: 160px; width: 100%;
  }
  .sidebar-brand-name-input:hover, .sidebar-brand-name-input:focus { border-bottom-color: var(--border); outline: none; }

  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 11px; border: none;
    font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif;
    color: var(--nav-text); background: var(--surface);
    box-shadow: 0 1px 2px rgba(35,35,56,0.04);
    cursor: pointer; text-align: left; width: 100%;
    transition: background 0.12s, color 0.12s;
  }
  .sidebar-item:hover { background: #F4F3F8; color: var(--text); }
  .sidebar-item[aria-current="page"] {
    background: var(--sidebar-active);
    color: var(--accent);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(138,95,201,0.15);
  }
  .sidebar-item .s-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: .75; }
  .sidebar-item[aria-current="page"] .s-icon { opacity: 1; }

  .sidebar-footer {
    border-top: 1px solid var(--sidebar-border);
    padding-top: 14px; margin-top: 10px;
    font-size: 12px; color: var(--muted); flex-shrink: 0;
  }
  .sidebar-theme-btn {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px;
    border-radius: 11px; font-size: 14px; font-weight: 500;
    color: var(--nav-text); background: transparent; border: none;
    cursor: pointer; width: 100%; text-align: left; font-family: 'Inter', sans-serif;
  }
  .sidebar-theme-btn:hover { background: #F4F3F8; color: var(--text); }

  .main { flex: 1; min-width: 0; padding: 34px 40px 88px; }
  .main .promo-bar { margin: 0 -40px 0; padding: 12px 40px; }

  /* ======= Casa Copilot right rail ======= */
  .copilot {
    width: 372px; flex: 0 0 372px; height: 100vh; position: sticky; top: 0;
    border-left: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; z-index: 25;
    transition: width .18s ease, flex-basis .18s ease, transform .18s ease;
  }
  .copilot.collapsed { width: 64px; flex-basis: 64px; }
  .copilot-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .copilot-title { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .copilot-name { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .copilot-actions { display: flex; gap: 6px; }
  .copilot-icon-btn { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); color: var(--text); }
  .copilot-body { overflow-y: auto; padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .copilot-context {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 14px;
    padding: 12px; font-size: 12.5px; color: var(--muted);
  }
  .copilot-context strong { display: block; color: var(--text); font-size: 14px; margin: 3px 0; }
  .copilot-context-grid { display: grid; gap: 4px; margin-top: 8px; }
  .copilot-pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .copilot-pill { padding: 4px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; }
  .copilot-quick { display: grid; gap: 8px; }
  .copilot-quick-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .copilot-quick button { text-align: left; border-radius: 12px; background: var(--surface-2); color: var(--text); padding: 10px 12px; font-size: 13px; }
  .copilot-quick button:hover { background: var(--accent-soft); color: var(--accent); }
  .copilot-chat { display: grid; gap: 10px; }
  .copilot-msg { max-width: 92%; border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  .copilot-msg.casa { background: var(--surface-2); color: var(--text); justify-self: start; }
  .copilot-msg.agent { background: var(--accent); color: #fff; justify-self: end; }
  .copilot-input-wrap { border-top: 1px solid var(--border); padding: 12px; background: var(--surface); }
  .copilot-input-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .copilot-input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .copilot-input {
    width: 100%; min-height: 42px; max-height: 120px; resize: vertical;
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 13px; background: var(--surface-2); color: var(--text);
  }
  .copilot-send { width: 42px; height: 42px; padding: 0; border-radius: 14px; background: var(--accent); color: #fff; }
  .copilot.collapsed .copilot-body,
  .copilot.collapsed .copilot-input-wrap,
  .copilot.collapsed .copilot-title,
  .copilot.collapsed .copilot-name,
  .copilot.collapsed .copilot-actions .copilot-new { display: none; }
  .copilot.collapsed .copilot-header { justify-content: center; padding: 14px 8px; border-bottom: none; }
  .copilot-mobile-fab { display: none; }

  .content-topbar { display: flex; align-items: center; padding: 0 0 8px; margin-bottom: 0; }
  .hamburger-btn {
    display: none; align-items: center; justify-content: center;
    background: var(--surface-2); border-radius: 10px;
    padding: 7px 10px; font-size: 20px; color: var(--text); border: none;
    cursor: pointer; line-height: 1;
  }
  .sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(35,35,56,.38); z-index: 29;
  }
  .sidebar-backdrop.open { display: block; }

  @media (max-width: 900px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%); z-index: 40; height: 100dvh;
    }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 32px rgba(35,35,56,0.18); }
    .main { padding: 20px 18px 88px; }
    .main .promo-bar { margin: 0 -18px 0; padding: 12px 18px; }
    .hamburger-btn { display: flex; }
    .copilot {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      width: 100%; height: min(78vh, 680px); flex-basis: auto;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      transform: translateY(110%); z-index: 45;
      box-shadow: 0 -12px 38px rgba(35,35,56,.18);
    }
    .copilot:not(.collapsed) { transform: translateY(0); }
    .copilot.collapsed { width: 100%; flex-basis: auto; transform: translateY(110%); }
    .copilot.collapsed .copilot-header { display: none; }
    .copilot-mobile-fab {
      display: block; position: fixed; right: 16px; bottom: 78px; z-index: 44;
      background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(124,95,196,.26);
    }
  }


  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; }
  .promo-bar {
    margin: 0 -18px 0; padding: 12px 18px; text-align: center;
    background: linear-gradient(90deg, var(--pastel-purple), var(--teal-bg), var(--gold-bg)); color: var(--text); font-size: 13px;
  }
  .promo-bar strong { color: var(--coral); text-decoration: underline; }
  .topbar {
    margin: 0 0 24px; padding: 0 0 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-emoji { font-size: 22px; }
  .brand-name-input {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px; font-weight: 600; letter-spacing: .01em;
    background: transparent; border: none; color: var(--text);
    border-bottom: 1px dashed transparent; padding: 0; min-width: 80px;
  }
  .brand-name-input:hover, .brand-name-input:focus { border-bottom-color: var(--border); outline: none; }
  .brand-sub { font-size: 12px; color: var(--muted); margin-top: -2px; }
  .nav-links { display: flex; align-items: center; gap: 20px; color: var(--nav-text); font-weight: 500; font-size: 14px; }
  .nav-links span { white-space: nowrap; }

  button {
    font-family: 'Inter', sans-serif; cursor: pointer; border: none; border-radius: 20px;
    padding: 9px 16px; font-weight: 600; font-size: 13px;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 10px rgba(124,95,196,0.22); }
  .btn-primary:hover { background: #6E4FB8; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-ghost:hover { background: var(--border); }
  .btn-danger { background: var(--red-soft); color: var(--red-strong); }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 20px; }
  .icon-btn { background: transparent; color: var(--muted); padding: 5px 8px; border-radius: 50%; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 1px 3px rgba(35,35,56,0.04);
  }
  .calendar-board { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(35,35,56,0.04); }
  .calendar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .calendar-col { min-height: 168px; border-right: 1px solid var(--border); padding: 8px; }
  .calendar-col:last-child { border-right: none; }
  .calendar-day { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; margin-bottom:8px; }
  .calendar-day small { color: var(--muted); font-weight:600; }
  .event-chip { border-radius: 11px; padding: 9px 10px; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--tile-text); display:flex; justify-content:space-between; gap:8px; }
  .event-chip .avatar-dot { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10px; color:#fff; background:rgba(0,0,0,.22); flex:0 0 auto; }
  .pastel-pink { background: var(--pastel-pink); }
  .pastel-purple { background: var(--pastel-purple); }
  .pastel-green { background: var(--pastel-green); }
  .pastel-blue { background: var(--pastel-blue); }
  .pastel-yellow { background: var(--pastel-yellow); }


  /* Dashboard */
  .phase-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .phase-tab {
    padding: 7px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
    background: var(--surface-2); color: var(--muted); border: 1px solid transparent;
  }
  .phase-tab .phase-tab-count { opacity: .75; font-weight: 600; margin-left: 4px; }
  .phase-tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .kanban-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
  .kanban-board.single-phase { grid-template-columns: 1fr; }
  .kanban-col { padding: 12px; border-radius: 14px; }
  .kanban-col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 12px; }
  .kanban-col-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .kanban-col-count { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kanban-cards { display: grid; gap: 10px; min-height: 40px; }
  .kanban-card {
    padding: 12px; border-radius: 11px; cursor: pointer; color: var(--row-text); border: 0;
  }
  .kanban-card:hover { filter: brightness(0.97); transform: translateY(-1px); }
  .kanban-card .listing-prop { font-size: 13.5px; font-weight: 600; }
  .kanban-card .listing-sub { margin-top: 4px; }
  .kanban-card .progress-wrap { margin-top: 10px; }
  .kanban-empty { padding: 16px 10px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .dashboard-head { display: flex; justify-content: space-between; align-items: end; margin: 0 0 20px; gap: 14px; flex-wrap: wrap; }
  .dashboard-head h2 { font-family: 'Fraunces', Georgia, serif; color: var(--heading); font-size: 28px; font-weight: 600; }
  .dashboard-head .sub { color: var(--muted); }
  .listing-row {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.6fr auto;
    gap: 14px; align-items: center; padding: 12px 16px; margin: 8px;
    border-radius: 11px; border: 0; cursor: pointer; color: var(--row-text);
  }
  .listing-row:nth-child(5n+1) { background: var(--pastel-green); }
  .listing-row:nth-child(5n+2) { background: var(--pastel-purple); }
  .listing-row:nth-child(5n+3) { background: var(--pastel-blue); }
  .listing-row:nth-child(5n+4) { background: var(--pastel-pink); }
  .listing-row:nth-child(5n+5) { background: var(--pastel-yellow); }
  .listing-row:last-child { border-bottom: none; }
  .listing-row:hover { filter: brightness(0.97); transform: translateY(-1px); }
  .listing-prop { font-weight: 700; font-size: 13.5px; }
  .listing-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stage-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px; white-space: nowrap; background: rgba(255,255,255,.6); color: var(--text);
  }

/* ---------- Persistence: KV API + localStorage fallback ---------- */
const API = "/api/state";

function loadStateLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveStateLocal(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}

async function loadStateRemote() {
  try {
    const res = await fetch(API);
    if (!res.ok) return null;
    const data = await res.json();
    return data;
  } catch (e) { return null; }
}

async function saveStateRemote(s) {
  try {
    await fetch(API, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(s),
    });
  } catch (e) {}
}

function saveState() {
  saveStateLocal(state);
  saveStateRemote(state);
}

let state = migrateState(loadStateLocal());
saveStateLocal(state);

// Async hydrate from KV then re-render
(async () => {
  const remote = await loadStateRemote();
  if (remote && remote.listings && remote.listings.length > 0) {
    state = migrateState(remote);
    saveStateLocal(state);
  } else if (!state.listings || state.listings.length === 0) {
    state.listings = sampleListings();
    saveState();
  }
  render();
})();

function migrateState(rawState) {
  const next = rawState || {};
  if (!next.teamName || next.teamName === "Your Real Estate Business") next.teamName = "Casa";
  if (next.theme !== "light" && next.theme !== "dark") next.theme = "light";
  if (!next.view || !next.view.screen) next.view = { screen: "dashboard", listingId: null };
  if (!next.copilot || typeof next.copilot !== "object") {
    next.copilot = { open: true, messages: [] };
  }
  if (typeof next.copilot.open !== "boolean") next.copilot.open = true;
  if (!Array.isArray(next.copilot.messages)) next.copilot.messages = [];
  if (!PHASES.includes(next.view.dashboardPhase)) {
    next.view.dashboardPhase = PHASES.includes(next.view.phase) ? next.view.phase : "Prep";
  }
  if (!DETAIL_TABS.includes(next.view.detailPhase)) {
    next.view.detailPhase = "Prep";
  }
  if (!DOC_CATEGORIES.includes(next.view.docCategory)) next.view.docCategory = "Buyer Offer";
  if (!Array.isArray(next.view.openDocs)) next.view.openDocs = ["wa_form_21"];
  const sectionNames = (CHECKLIST_TEMPLATE || []).map(s => s.section);
  if (!sectionNames.includes(next.view.checklistSection)) {
    next.view.checklistSection = sectionNames[0] || null;
  }
  delete next.view.phase;
  if (!Array.isArray(next.listings)) next.listings = [];
  const hasOnlyOldPlaceholder = next.listings.length === 1
    && next.listings[0].property === "123 Example St, Sample City"
    && String(next.listings[0].seller || "").startsWith("Sample Seller");
  if (hasOnlyOldPlaceholder) next.listings = sampleListings();
  next.listings = next.listings.map(l => {
    const base = {
      id: uid(), property: "", seller: "", mls: "", listPrice: "",
      goLive: "", openHouse1: "", openHouse2: "", mutualAcceptance: "", appraisalDate: "", closingDate: "",
      stage: "Listing Signed", notes: [], vendors: [], checklist: freshChecklist(),
    };
    const merged = Object.assign(base, l, {
      vendors: Array.isArray(l.vendors) ? l.vendors : [],
      checklist: Array.isArray(l.checklist) ? l.checklist : freshChecklist(),
    });
    // Migrate old string notes → log entry
    if (typeof merged.notes === "string") {
      merged.notes = merged.notes.trim()
        ? [{ id: uid(), text: merged.notes.trim(), ts: Date.now() }]
        : [];
    }
    if (!Array.isArray(merged.notes)) merged.notes = [];
    return merged;
  });
  return next;
}

/* ---------- Derived helpers ---------- */
function progress(listing) {
  const total = listing.checklist.length;
  const done = listing.checklist.filter(t => t.done).length;
  return { total, done, open: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function stageColor(stage) {
  if (stage === "Closed") return { bg: "var(--accent-soft)", fg: "var(--accent)" };
  if (stage === "Pending") return { bg: "var(--blue-soft)", fg: "var(--blue)" };
  if (stage === "MLS Live") return { bg: "var(--yellow-soft)", fg: "var(--yellow)" };
  return { bg: "var(--surface-2)", fg: "var(--muted)" };
}

function esc(str) {
  return String(str || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* ---------- Rendering ---------- */
const app = document.getElementById("app");

function render() {
  if (state.theme !== "light" && state.theme !== "dark") state.theme = "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  let content;
  if (state.view.screen === "detail") {
    content = renderDetail(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "checklist") {
    content = renderChecklistScreen(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "timeline") {
    content = renderTimeline(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "documents") {
    content = renderDocuments();
  } else if (state.view.screen === "settings") {
    content = renderSettings();
  } else {
    content = renderDashboard();
  }
  app.innerHTML = `
    <div class="app-shell">
      ${renderSidebar()}
      <div class="main" id="mainContent">
        ${content}
      </div>
      ${renderCopilot()}
    </div>
    <button class="copilot-mobile-fab" id="copilotMobileFab">Casa</button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>`;
  bindEvents();
}

function copilotContext() {
  const listing = currentListing() || state.listings[0] || null;

  const p = listing ? progress(listing) : null;
  return { listing, screen, phase, progress: p };
}

function copilotSuggestions(ctx) {
  if (ctx.screen === "detail") return ["What should I do next?", "Review this listing", "What am I missing?", "Explain earnest money"];
  if (ctx.screen === "checklist") return ["Review my checklist", "What is incomplete?", "Which items are urgent?", "Prepare listing documents"];
  if (ctx.screen === "timeline") return ["What's due next?", "Show upcoming deadlines", "Explain mutual acceptance", "Review closing timeline"];
  if (ctx.screen === "documents") return ["Which form starts a buyer offer?", "Explain Form 21", "What documents need deadlines?", "What should a new agent watch out for?"];
  if (ctx.screen === "settings") return ["Review vendor coverage", "What vendors are missing?", "Explain transaction coordinator", "Help organize this file"];
  return ["What should I do next?", "Which listings need attention?", "Show upcoming deadlines", "Review listing readiness"];
}

function copilotReply(prompt) {
  const ctx = copilotContext();
  const listing = ctx.listing;
  const lower = prompt.toLowerCase();
  if (!listing) return "I don't have a listing selected yet. Open or create a listing so I can use its context.";
  const openTasks = listing.checklist.filter(t => !t.done);
  const highOpen = openTasks.filter(t => t.priority === "High");
  const dates = [
    ["Go-Live", listing.goLive], ["Open House #1", listing.openHouse1], ["Open House #2", listing.openHouse2],
    ["Mutual Acceptance", listing.mutualAcceptance], ["Appraisal", listing.appraisalDate], ["Closing", listing.closingDate],
  ].filter(([, d]) => d);
  if (lower.includes("missing") || lower.includes("incomplete") || lower.includes("review")) {
    return `For ${listing.property}, I see ${openTasks.length} open checklist items. ${highOpen.length ? `${highOpen.length} are high priority: ${highOpen.slice(0, 4).map(t => t.name).join("; ")}.` : "No high-priority checklist items are currently open."}\n\nGuardrail: confirm contract/document decisions with your managing broker when the source file is incomplete.`;
  }
  if (lower.includes("due") || lower.includes("deadline") || lower.includes("timeline")) {
    return dates.length
      ? `Tracked dates for ${listing.property}:\n${dates.map(([name, date]) => `• ${name}: ${date}`).join("\n")}\n\nI can only use dates already stored in Casa; I won't infer contract deadlines without the transaction inputs.`
      : `I don't see any timeline dates stored for ${listing.property} yet. Add go-live, open house, mutual acceptance, appraisal, or closing dates first.`;
  }
  if (lower.includes("earnest money")) {
    return "Earnest money is money the buyer deposits after an offer is accepted to show they intend to complete the purchase. The purchase agreement controls when it must be deposited, who holds it, and what happens if the transaction does not close.";
  }
  const doc = DOCUMENT_LIBRARY.find(d => lower.includes(d.shortName.toLowerCase()) || lower.includes(d.name.toLowerCase().split(" ")[0]) || lower.includes(d.category.toLowerCase()));
  if (doc) {
    return `${doc.shortName}: ${doc.purpose}\n\nUsed when: ${doc.usedWhen}\n\nInformation needed: ${doc.needs.slice(0, 5).join("; ")}.\n\nWatch out: ${doc.watchOut.slice(0, 3).join("; ")}.\n\nCasa can explain workflow and common fields, but confirm transaction-specific questions with your managing broker or attorney.`;
  }
  if (lower.includes("form") || lower.includes("document") || lower.includes("offer")) {
    return "V1 document guidance is scaffolded only. Recommended next step: build a Washington Residential Buyer Offer transaction object, then map supported fields to document definitions. Casa should validate structured data before any document is generated — not let AI directly edit PDFs.";
  }
  return `I'm looking at ${listing.property} (${ctx.phase}). Next practical step: handle the highest-priority open checklist item: ${highOpen[0]?.name || openTasks[0]?.name || "the listing looks complete in the current checklist"}.`;
}

function renderCopilot() {
  const ctx = copilotContext();
  const listing = ctx.listing;
  const open = state.copilot?.open !== false;
  const messages = state.copilot?.messages || [];
  const suggestions = copilotSuggestions(ctx).map(s => `<button data-copilot-quick="${esc(s)}">${esc(s)}</button>`).join("");
  const chat = messages.length
    ? messages.slice(-8).map(m => `<div class="copilot-msg ${m.role === "agent" ? "agent" : "casa"}">${esc(m.text)}</div>`).join("")
    : `<div class="copilot-msg casa">I'm Casa Copilot. I use the current listing context to help you find next actions, explain terms, review missing fields, and summarize deadlines.</div>`;
  const contextRows = listing
    ? `<strong>${esc(listing.property || "Untitled listing")}</strong>
       <div class="copilot-context-grid">
         <span>Seller: ${esc(listing.seller || "Unknown")}</span>
         <span>Status: ${esc(listing.stage || "Unknown")} · ${esc(ctx.phase)}</span>
         <span>Checklist: ${ctx.progress.done}/${ctx.progress.total} complete</span>
       </div>
       <div class="copilot-pill-row" style="margin-top:10px;">
         <span class="copilot-pill">Context-aware</span><span class="copilot-pill">No legal advice</span>
       </div>`
    : `<strong>No listing selected</strong><div class="copilot-context-grid"><span>Open a listing so Casa can use its context.</span></div>`;
  return `
    <aside class="copilot ${open ? "" : "collapsed"}" id="casaCopilot" aria-label="Casa Copilot">
      <div class="copilot-header">
        <div><div class="copilot-title">Casa Copilot</div><div class="copilot-name">Casa</div></div>
        <div class="copilot-actions">
          <button class="copilot-icon-btn copilot-new" id="copilotNewChat" title="New chat">＋</button>
          <button class="copilot-icon-btn" id="copilotToggle" title="${open ? "Collapse" : "Open"}">${open ? "×" : "Casa"}</button>
        </div>
      </div>
      <div class="copilot-body">
        <div class="copilot-context"><span>Working on:</span>${contextRows}</div>
        <div class="copilot-quick"><div class="copilot-quick-title">Ask Casa</div>${suggestions}</div>
        <div class="copilot-chat">${chat}</div>
      </div>
      <div class="copilot-input-wrap">
        <div class="copilot-input-label">Ask Casa about this transaction…</div>

          <button class="copilot-send" id="copilotSend" aria-label="Send to Casa">↑</button>
        </div>

}

function listingPhase(listing) {
  if (listing.stage === "Pending" || listing.stage === "Closed") return "Pending/Close";
  if (listing.stage === "MLS Live") {
    const offersReviewed = listing.checklist.some(t => t.name === "Offers Reviewed" && t.done);
    return offersReviewed ? "Showings/Offers" : "MLS Live";
  }
  return "Prep";
}

function renderDashboard() {
  const activePhase = PHASES.includes(state.view.dashboardPhase) ? state.view.dashboardPhase : "Prep";
  const phaseTabs = PHASES.map(phase => {
    const count = state.listings.filter(l => listingPhase(l) === phase).length;
    return `<button class="phase-tab ${phase === activePhase ? "active" : ""}" data-phase-tab="${esc(phase)}">${esc(phase)} <span class="phase-tab-count">${count}</span></button>`;
  }).join("");

  const listings = state.listings.filter(l => listingPhase(l) === activePhase);
  const rows = listings.map(l => {
    const p = progress(l);
    const sc = stageColor(l.stage);
    return `
      <div class="listing-row" data-open="${l.id}">
        <div>
          <div class="listing-prop">🏠 ${esc(l.property) || "Untitled listing"}</div>
          <div class="listing-sub">👤 ${esc(l.seller) || "No seller yet"}${l.listPrice ? " · 💵 " + esc(l.listPrice) : ""}</div>
        </div>
        <div><span class="stage-badge" style="background:${sc.bg}; color:${sc.fg}">${esc(l.stage)}</span></div>
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p.pct}%"></div></div>
          <div class="progress-label">${p.pct}% complete</div>
        </div>
        <div class="open-items">${p.open}<small>open items</small></div>
        <button class="icon-btn btn-sm" data-delete="${l.id}" title="Delete listing">✕</button>
      </div>`;
  }).join("");

  const board = state.listings.length
    ? (rows || `<div class="card empty-state"><div class="big">🏠</div>No listings in this phase.</div>`)
    : `<div class="card empty-state"><div class="big">🏠</div>No listings yet. Add your first one to start tracking.</div>`;

  return `
    ${renderTopbar()}
    <div class="dashboard-head">
      <h2>Listings</h2>
      <button class="btn-primary" id="addListingBtn">+ New Listing</button>
    </div>
    <div class="phase-tabs" aria-label="Listing phases">${phaseTabs}</div>
    <div class="listing-board">${board}</div>
    ${renderBottomTabs()}
  `;
}

function renderChecklistSections(listing, phase) {
  const sections = phase ? CHECKLIST_TEMPLATE.filter(sec => (PHASE_SECTIONS[phase] || []).includes(sec.section)) : CHECKLIST_TEMPLATE;
  return sections.map(sec => {
    const tasks = listing.checklist.filter(t => t.section === sec.section);
    const done = tasks.filter(t => t.done).length;
    const rows = tasks.map(t => `
      <div class="task-row ${t.done ? "done" : ""}">
        <input type="checkbox" class="task-check" data-task="${t.id}" ${t.done ? "checked" : ""} />
        <div>
          <div class="task-name ${t.done ? "strike" : ""}">${esc(t.name)}</div>
          <div class="task-tags">
            <span class="tag tag-priority-${t.priority.toLowerCase()}">${esc(t.priority)}</span>
            <span class="tag tag-owner">${esc(t.owner)}</span>

        </div>
      </div>`).join("");
    return `
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title">${esc(sec.section)}</div>
          <div class="section-meta">${done}/${tasks.length} done</div>

        <div class="task-list">${rows}</div>

  }).join("");
}

function renderBottomTabs() {

}

function fmtTs(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
    + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

    : `<div style="padding:20px 0; color:var(--muted); font-size:13.5px;">No notes yet — add the first one above.</div>`;

function renderChecklistScreen(listing) {
  if (!listing) return renderListingScopedEmpty("checklist");
  const sectionNames = CHECKLIST_TEMPLATE.map(s => s.section);
  const activeSec = sectionNames.includes(state.view.checklistSection)
    ? state.view.checklistSection : sectionNames[0];

  const tabs = sectionNames.map(sec => {
    const tasks = listing.checklist.filter(t => t.section === sec);
    const done = tasks.filter(t => t.done).length;
    const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    return `<button class="cl-tab ${sec === activeSec ? "active" : ""}" data-checklist-tab="${esc(sec)}">
      ${esc(sec.replace("+ ", "+\u200B"))}
      <span class="cl-tab-pct">${pct}%</span>
    </button>`;
  }).join("");

  const activeTasks = listing.checklist.filter(t => t.section === activeSec);
  const doneCount = activeTasks.filter(t => t.done).length;
  const taskRows = activeTasks.map(t => `
    <div class="task-row ${t.done ? "done" : ""}">
      <input type="checkbox" class="task-check" data-task="${t.id}" ${t.done ? "checked" : ""} />
      <div>
        <div class="task-name ${t.done ? "strike" : ""}">${esc(t.name)}</div>

}

/* ---------- Event binding ---------- */
function bindEvents() {
  // hamburger / sidebar drawer
  const hamburger = document.getElementById("hamburgerBtn");
  const sidebar = document.getElementById("appSidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  function openSidebar() {
    if (sidebar) sidebar.classList.add("open");
    if (backdrop) backdrop.classList.add("open");
    if (hamburger) hamburger.setAttribute("aria-expanded", "true");
  }
  function closeSidebar() {
    if (sidebar) sidebar.classList.remove("open");
    if (backdrop) backdrop.classList.remove("open");
    if (hamburger) hamburger.setAttribute("aria-expanded", "false");
  }
  if (hamburger) hamburger.addEventListener("click", openSidebar);
  if (backdrop) backdrop.addEventListener("click", closeSidebar);
  document.addEventListener("keydown", function escHandler(e) {
    if (e.key === "Escape") closeSidebar();
  }, { once: true });

  const teamNameInput = document.getElementById("teamNameInput");
  if (teamNameInput) teamNameInput.addEventListener("change", e => { state.teamName = e.target.value; saveState(); });

  const themeToggle = document.getElementById("themeToggle");
  if (themeToggle) themeToggle.addEventListener("click", toggleTheme);

  const settingsThemeToggle = document.getElementById("settingsThemeToggle");
  if (settingsThemeToggle) settingsThemeToggle.addEventListener("click", toggleTheme);

  const settingsTeamName = document.getElementById("settingsTeamName");
  if (settingsTeamName) settingsTeamName.addEventListener("change", e => { state.teamName = e.target.value; saveState(); render(); });

  const copilotToggle = document.getElementById("copilotToggle");
  if (copilotToggle) copilotToggle.addEventListener("click", () => {
    state.copilot.open = !state.copilot.open;
    saveState(); render();
  });

  const copilotMobileFab = document.getElementById("copilotMobileFab");
  if (copilotMobileFab) copilotMobileFab.addEventListener("click", () => {
    state.copilot.open = true;
    saveState(); render();
  });

  const copilotNewChat = document.getElementById("copilotNewChat");
  if (copilotNewChat) copilotNewChat.addEventListener("click", () => {
    state.copilot.messages = [];
    saveState(); render();
  });

  function sendCopilotMessage(text) {
    const prompt = String(text || "").trim();
    if (!prompt) return;
    state.copilot.open = true;
    state.copilot.messages.push({ role: "agent", text: prompt, ts: Date.now() });
    state.copilot.messages.push({ role: "casa", text: copilotReply(prompt), ts: Date.now() });
    state.copilot.messages = state.copilot.messages.slice(-30);
    saveState(); render();
  }

  const copilotSend = document.getElementById("copilotSend");
  const copilotInput = document.getElementById("copilotInput");
  if (copilotSend && copilotInput) {
    copilotSend.addEventListener("click", () => sendCopilotMessage(copilotInput.value));
    copilotInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault(); sendCopilotMessage(copilotInput.value);
      }
    });
  }

  document.querySelectorAll("[data-copilot-quick]").forEach(el => {
    el.addEventListener("click", () => sendCopilotMessage(el.getAttribute("data-copilot-quick")));
  });

  document.querySelectorAll("[data-doc-question]").forEach(el => {
    el.addEventListener("click", () => sendCopilotMessage(el.getAttribute("data-doc-question")));
  });

  document.querySelectorAll("[data-doc-category]").forEach(el => {
    el.addEventListener("click", () => {
      state.view.docCategory = el.getAttribute("data-doc-category");
      const firstDoc = DOCUMENT_LIBRARY.find(d => d.category === state.view.docCategory);
      state.view.openDocs = firstDoc ? [firstDoc.id] : [];
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-doc-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const docId = el.getAttribute("data-doc-toggle");
      const openDocs = new Set(Array.isArray(state.view.openDocs) ? state.view.openDocs : []);
      if (openDocs.has(docId)) openDocs.delete(docId); else openDocs.add(docId);
      state.view.openDocs = [...openDocs];
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const tab = el.getAttribute("data-tab");
      if (tab === "dashboard") {
        state.view = { screen: "dashboard", listingId: null, dashboardPhase: state.view.dashboardPhase || "Prep" };
      } else {
        // Auto-select first listing if none selected
        const listingId = state.view.listingId || (state.listings[0] && state.listings[0].id) || null;
        state.view = { screen: tab, listingId, dashboardPhase: state.view.dashboardPhase || "Prep" };
      }
      closeSidebar();
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-phase-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const phase = el.getAttribute("data-phase-tab");
      if (!PHASES.includes(phase)) return;
      state.view = { screen: "dashboard", listingId: null, dashboardPhase: phase };
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-detail-phase-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const phase = el.getAttribute("data-detail-phase-tab");
      if (!DETAIL_TABS.includes(phase)) return;
      state.view.detailPhase = phase;
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-checklist-tab]").forEach(el => {
    el.addEventListener("click", () => {
      state.view.checklistSection = el.getAttribute("data-checklist-tab");
      saveState(); render();
    });
  });

  const listingPicker = document.getElementById("listingPicker");
  if (listingPicker) listingPicker.addEventListener("change", e => {
    state.view.listingId = e.target.value;
    saveState(); render();
  });

  // Notes log: submit
  const noteSubmitBtn = document.getElementById("noteSubmitBtn");
  const noteInput = document.getElementById("noteInput");
  if (noteSubmitBtn && noteInput) {
    const submit = () => {
      const text = noteInput.value.trim();
      if (!text) return;
      const listing = currentListing();
      if (!listing) return;
      if (!Array.isArray(listing.notes)) listing.notes = [];
      listing.notes.push({ id: uid(), text, ts: Date.now() });
      saveState(); render();
    };
    noteSubmitBtn.addEventListener("click", submit);
    noteInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    });
  }

  // Notes log: inline edit (click text → contenteditable, blur → save)
  document.querySelectorAll("[data-note-text]").forEach(el => {
    el.addEventListener("click", () => {
      if (el.contentEditable === "true") return;
      el.contentEditable = "true";
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    });
    el.addEventListener("blur", () => {
      el.contentEditable = "false";
      const listing = currentListing();
      if (!listing) return;
      const noteId = el.getAttribute("data-note-text");
      const note = listing.notes.find(n => n.id === noteId);
      if (note) {
        const newText = el.textContent.trim();
        if (newText && newText !== note.text) {
          note.text = newText;
          note.ts = Date.now(); // bump timestamp on edit
          saveState();
        }
      }
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); el.blur(); }
      if (e.key === "Escape") { el.contentEditable = "false"; render(); }
    });
  });

  // Notes log: delete
  document.querySelectorAll("[data-note-delete]").forEach(el => {
    el.addEventListener("click", () => {
      const listing = currentListing();
      if (!listing) return;
      const noteId = el.getAttribute("data-note-delete");
      listing.notes = listing.notes.filter(n => n.id !== noteId);
      saveState(); render();
    });
  });

  const addBtn = document.getElementById("addListingBtn");
  if (addBtn) addBtn.addEventListener("click", openAddModal);

  document.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete]")) return;
      state.view = { screen: "detail", listingId: el.getAttribute("data-open"), dashboardPhase: state.view.dashboardPhase || "Prep", detailPhase: state.view.detailPhase || "Prep" };
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-delete]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-delete");
      const listing = state.listings.find(l => l.id === id);
      if (confirm(`Delete "${listing.property || "this listing"}"? This can't be undone.`)) {
        state.listings = state.listings.filter(l => l.id !== id);
        saveState(); render();
      }
    });
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", () => {
    state.view = { screen: "dashboard", listingId: null };
    saveState(); render();
  });

  document.querySelectorAll(".task-check").forEach(el => {
    el.addEventListener("change", () => {
      const listing = currentListing();
      const task = listing.checklist.find(t => t.id === el.getAttribute("data-task"));
      task.done = el.checked;
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-stage]").forEach(el => {
    el.addEventListener("click", () => {
      currentListing().stage = el.getAttribute("data-stage");
      saveState(); render();
    });
  });

  bindFieldInput("propertyInput", "property");
  bindFieldInput("f_seller", "seller");
  bindFieldInput("f_mls", "mls");
  bindFieldInput("f_listPrice", "listPrice");
  bindFieldInput("f_goLive", "goLive");
  bindFieldInput("f_openHouse1", "openHouse1");
  bindFieldInput("f_openHouse2", "openHouse2");
  bindFieldInput("f_mutualAcceptance", "mutualAcceptance");
  bindFieldInput("f_appraisalDate", "appraisalDate");
  bindFieldInput("f_closingDate", "closingDate");

  const addVendorBtn = document.getElementById("addVendorBtn");
  if (addVendorBtn) addVendorBtn.addEventListener("click", () => {
    const listing = currentListing();
    if (!listing) return;
    const name = document.getElementById("vendorName").value.trim();
    const role = document.getElementById("vendorRole").value.trim();
    const contact = document.getElementById("vendorContact").value.trim();
    if (!name && !role && !contact) return;
    listing.vendors.push({ id: uid(), name, role, contact });
    saveState(); render();
  });

  document.querySelectorAll("[data-vendor-delete]").forEach(el => {
    el.addEventListener("click", () => {
      const listing = currentListing();
      if (!listing) return;
      listing.vendors = listing.vendors.filter(v => v.id !== el.getAttribute("data-vendor-delete"));
      saveState(); render();
    });
  });
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveState(); render();
}

function bindFieldInput(elId, key) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.addEventListener("change", () => {
    currentListing()[key] = el.value;
    saveState();
  });
}

function currentListing() {
  return state.listings.find(l => l.id === state.view.listingId);
}

/* ---------- Add listing modal ---------- */
function openAddModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="card modal">
      <h3>New Listing</h3>
      <div class="sub">Starts with the full pre-listing-to-closing checklist.</div>
      <div class="field"><label>Property Address</label><input id="m_property" placeholder="123 Main St, City" /></div>
      <div class="field"><label>Seller(s)</label><input id="m_seller" placeholder="Jane & John Smith" /></div>
      <div class="field"><label>MLS #</label><input id="m_mls" /></div>
      <div class="field"><label>List Price</label><input id="m_listPrice" placeholder="$650,000" /></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="m_cancel">Cancel</button>
        <button class="btn-primary" id="m_create">Create Listing</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById("m_cancel").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("m_create").addEventListener("click", () => {
    const property = document.getElementById("m_property").value.trim();
    const listing = freshListing({
      property,
      seller: document.getElementById("m_seller").value.trim(),
      mls: document.getElementById("m_mls").value.trim(),
      listPrice: document.getElementById("m_listPrice").value.trim(),
    });
    state.listings.unshift(listing);
    state.view = { screen: "detail", listingId: listing.id };
    saveState();
    overlay.remove();
    render();
  });
}

render();
</script>
</body>
</html>
