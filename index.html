<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa</title>
<style>
  :root {
    --bg: #fbfaf6;
    --surface: #fffdf8;
    --surface-2: #f3efe5;
    --text: #2d2a26;
    --muted: #6f6a61;
    --border: #ded5c4;
    --accent: #1f6f8b;
    --accent-soft: #e5f3f6;
    --green: #3d8064;
    --yellow: #d8932a;
    --yellow-soft: #fff2d5;
    --red: #c9573d;
    --red-soft: #fde8df;
    --blue: #1f6f8b;
    --blue-soft: #e5f3f6;
    --lavender: #eee1f2;
    --cream: #fbfaf6;
    --shadow: 0 18px 45px rgba(64,50,32,0.12), 0 2px 8px rgba(64,50,32,0.06);
    --radius: 24px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #171717;
      --surface: #232220;
      --surface-2: #2d2b27;
      --text: #fbfaf6;
      --muted: #b9b0a2;
      --border: #3d3932;
      --accent: #73c3d8;
      --accent-soft: #173540;
      --green: #83c5a5;
      --yellow: #f0bd56;
      --yellow-soft: #3d311e;
      --red: #ee8a72;
      --red-soft: #3d2923;
      --blue: #73c3d8;
      --blue-soft: #173540;
      --lavender: #33283a;
      --cream: #171717;
      --shadow: 0 18px 45px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171717;
    --surface: #232220;
    --surface-2: #2d2b27;
    --text: #fbfaf6;
    --muted: #b9b0a2;
    --border: #3d3932;
    --accent: #73c3d8;
    --accent-soft: #173540;
    --green: #83c5a5;
    --yellow: #f0bd56;
    --yellow-soft: #3d311e;
    --red: #ee8a72;
    --red-soft: #3d2923;
    --blue: #73c3d8;
    --blue-soft: #173540;
    --lavender: #33283a;
    --cream: #171717;
    --shadow: 0 18px 45px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 8% 10%, rgba(236,225,242,0.9), transparent 30%),
      linear-gradient(180deg, #fffdf9 0%, var(--bg) 28%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  #app { max-width: 1140px; margin: 0 auto; padding: 0 18px 88px; }

  h1, h2, h3 { font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  h1, .brand-name-input { font-family: Georgia, "Times New Roman", serif; }
  .promo-bar {
    margin: 0 -18px 0; padding: 14px 18px; text-align: center;
    background: var(--lavender); color: var(--text); font-size: 15px;
  }
  .promo-bar strong { color: #dd664f; text-decoration: underline; }
  .topbar {
    margin: 0 -18px 28px; padding: 20px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    background: rgba(255,253,248,0.86); border-bottom: 1px solid rgba(222,213,196,0.7);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-emoji { font-size: 32px; filter: drop-shadow(0 8px 18px rgba(31,111,139,0.2)); }
  .brand-name-input {
    font-size: 34px; font-weight: 500; letter-spacing: -0.04em;
    background: transparent; border: none; color: var(--accent);
    border-bottom: 1px dashed transparent; padding: 0; min-width: 118px;
  }
  .brand-name-input:hover, .brand-name-input:focus { border-bottom-color: var(--border); outline: none; }
  .brand-sub { font-size: 13px; color: var(--muted); margin-top: -3px; }
  .nav-links { display: flex; align-items: center; gap: 26px; color: var(--text); font-weight: 600; }
  .nav-links span { white-space: nowrap; }

  button {
    font: inherit; cursor: pointer; border: none; border-radius: 999px;
    padding: 11px 18px; font-weight: 700; font-size: 14px;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 10px 22px rgba(31,111,139,0.22); }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-ghost:hover { filter: brightness(0.97); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-sm { padding: 7px 11px; font-size: 13px; border-radius: 999px; }
  .icon-btn { background: transparent; color: var(--muted); padding: 6px 9px; border-radius: 999px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .card {
    background: rgba(255,253,248,0.92); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  /* Dashboard */
  .hero {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
    gap: 32px; align-items: center; margin: 8px 0 30px;
  }
  .hero-copy { padding: 10px 0 18px; }
  .rating { color: var(--yellow); font-weight: 800; letter-spacing: 0.05em; margin-bottom: 10px; }
  .hero h1 { font-size: clamp(42px, 6vw, 70px); line-height: 0.95; color: #3a3834; }
  .hero p { max-width: 520px; margin: 18px 0 24px; color: var(--muted); font-size: 18px; }
  .hero-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .device-card {
    position: relative; min-height: 340px; padding: 26px;
    background: linear-gradient(135deg, #f8f2e7, #ffffff 52%, #e7f3f5);
    border-radius: 32px; overflow: hidden;
  }
  .device-screen {
    background: #fff; border: 14px solid #f8f7f4; border-radius: 30px;
    min-height: 260px; padding: 20px; box-shadow: 0 24px 45px rgba(55,46,31,0.22);
    transform: rotate(-1.5deg);
  }
  .screen-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .screen-title { font-family: Georgia, "Times New Roman", serif; font-size: 24px; color: var(--accent); }
  .screen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .screen-tile { min-height: 64px; border-radius: 14px; padding: 10px; font-size: 12px; font-weight: 700; color: #554b3e; }
  .screen-tile:nth-child(1) { background: #f6cfc4; }
  .screen-tile:nth-child(2) { background: #cde7e8; }
  .screen-tile:nth-child(3) { background: #f9e4a8; }
  .screen-tile:nth-child(4) { background: #d6ead7; }
  .screen-tile:nth-child(5) { background: #e5d7f0; }
  .screen-tile:nth-child(6) { background: #f3d8c4; }
  .seal {
    position: absolute; left: 22px; top: 20px; width: 82px; height: 82px; border-radius: 50%;
    display: grid; place-items: center; text-align: center; padding: 10px;
    background: #13465a; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
    transform: rotate(-12deg);
  }
  .dashboard-head { display: flex; justify-content: space-between; align-items: end; margin: 0 0 14px; gap: 14px; flex-wrap: wrap; }
  .dashboard-head h2 { font-family: Georgia, "Times New Roman", serif; color: #3a3834; font-size: 34px; font-weight: 500; }
  .dashboard-head .sub { color: var(--muted); }
  .listing-row {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.6fr auto;
    gap: 14px; align-items: center; padding: 18px 20px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .listing-row:last-child { border-bottom: none; }
  .listing-row:hover { background: rgba(31,111,139,0.06); }
  .listing-prop { font-weight: 750; }
  .listing-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .stage-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  }
  .progress-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
  .progress-bar-bg { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .progress-label { font-size: 12px; color: var(--muted); }
  .open-items { font-size: 14px; color: var(--text); text-align: center; font-weight: 750; }
  .open-items small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
  .empty-state .big { font-size: 34px; margin-bottom: 10px; }

  /* Detail view */
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13.5px; font-weight: 750; background: none; padding: 6px 0; margin-bottom: 10px; }
  .back-link:hover { color: var(--text); }
  .detail-header { padding: 24px; margin-bottom: 18px; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 16px; margin-top: 16px; }
  .field label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 5px; font-weight: 750; }
  .field input, .field textarea {
    width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field textarea { resize: vertical; min-height: 82px; }

  .stage-stepper { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .stage-pill {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 750;
    background: var(--surface-2); color: var(--muted); border: 1px solid transparent;
  }
  .stage-pill.done { background: var(--accent-soft); color: var(--accent); }
  .stage-pill.current { background: var(--accent); color: #fff; }

  .summary-row { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; }
  .summary-item { min-width: 130px; }
  .summary-num { font-size: 24px; font-weight: 800; }
  .summary-cap { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .section-card { margin-bottom: 14px; overflow: hidden; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px; cursor: pointer; user-select: none;
  }
  .section-head:hover { background: rgba(31,111,139,0.06); }
  .section-title { font-size: 15px; font-weight: 750; }
  .section-meta { font-size: 12.5px; color: var(--muted); }
  .task-list { border-top: 1px solid var(--border); }
  .task-row {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .task-row:last-child { border-bottom: none; }
  .task-row.done { opacity: 0.55; }
  .task-check {
    width: 19px; height: 19px; margin-top: 1px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer;
  }
  .task-name { font-size: 14px; }
  .task-name.strike { text-decoration: line-through; }
  .task-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 750; }
  .tag-owner { background: var(--surface-2); color: var(--muted); }
  .tag-priority-high { background: var(--red-soft); color: var(--red); }
  .tag-priority-medium { background: var(--yellow-soft); color: var(--yellow); }
  .tag-priority-low { background: var(--blue-soft); color: var(--blue); }

  .notes-card { padding: 20px; margin-top: 14px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,12,10,0.45);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal { width: 100%; max-width: 460px; padding: 24px; }
  .modal h3 { margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .modal .field { margin-bottom: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .theme-toggle { font-size: 18px; background: var(--surface-2); border-radius: 999px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .mobile-bottom-tabs { display: none; }
  .timeline-list { display: grid; gap: 10px; }
  .timeline-item { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); }
  .timeline-item:first-child { border-top: none; }
  .timeline-dot { width: 11px; height: 11px; border-radius: 999px; background: var(--accent); margin-top: 6px; }
  .timeline-title { font-weight: 750; }
  .timeline-date { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .vendor-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }

  @media (max-width: 780px) {
    .nav-links span:not(:last-child) { display: none; }
    .hero { grid-template-columns: 1fr; gap: 18px; }
    .device-card { min-height: 280px; }
    .device-screen { min-height: 220px; }
  }

  @media (max-width: 640px) {
    #app { padding: 0 14px 96px; }
    .promo-bar, .topbar { margin-left: -14px; margin-right: -14px; }
    .brand-name-input { font-size: 30px; }
    .hero h1 { font-size: 44px; }
    .hero p { font-size: 16px; }
    .listing-row { grid-template-columns: 1fr; gap: 8px; }
    .open-items { text-align: left; }
    .progress-wrap { min-width: 0; }
    .desktop-only { display: none; }
    .vendor-row { grid-template-columns: 1fr; }
    .mobile-bottom-tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .tab-btn { background: transparent; color: var(--muted); border-radius: 14px; padding: 8px 4px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .tab-btn strong { font-size: 18px; line-height: 1; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Template: checklist structure lifted from the original spreadsheet ---------- */
const CHECKLIST_TEMPLATE = [
  { section: "Pre-Listing Documents", tasks: [
    ["Realist PDF copy saved in file", "Medium", "Admin"],
    ["Listing Agreement (Form 1A)", "High", "Listing Agent"],
    ["WBC Disclosure Receipt", "High", "Listing Agent"],
    ["Listing Input Sheet (Form 1 or 10)", "High", "Admin"],
    ["Seller Disclosure (Form 17)", "High", "Seller"],
    ["FIRPTA Certification (Form 22E)", "High", "Seller"],
    ["Lead Disclosure (Form 22J)", "High", "Seller"],
    ["Identification of Utilities (Form 22K)", "Medium", "Seller"],
    ["Pre-Inspection Agreement (Form 35P)", "Medium", "Admin"],
    ["Seller Procured Inspection (WRE Form 42)", "Medium", "Admin"],
    ["Exhibit A, Legal, with initials", "High", "Admin"],
    ["Re-Sale Cert Ordered (Condo Only)", "Low", "Admin"],
  ]},
  { section: "Scheduling + Property Prep", tasks: [
    ["Pre-Inspection Scheduled", "High", "Admin"],
    ["Sewer Scope Scheduled", "High", "Admin"],
    ["Order Title Package", "High", "Admin"],
    ["Stake Sign Location", "Medium", "Listing Agent"],
    ["Sign Ordered", "Medium", "Admin"],
    ["Cleaner Scheduled", "Medium", "Admin"],
    ["Window Cleaning Scheduled", "Medium", "Admin"],
    ["Keys Made", "Medium", "Admin"],
    ["Staging Scheduled", "High", "Admin"],
    ["Photo Shoot Appointment Set", "High", "Marketing"],
    ["Add Listing to Supra & Lockbox Synced", "High", "Admin"],
  ]},
  { section: "Marketing + MLS Launch", tasks: [
    ["Photo shot list shared with photographer", "High", "Marketing"],
    ["Send Title & Title Review to Client", "High", "Admin"],
    ["Order Talkers", "Medium", "Marketing"],
    ["House Competition Tour", "Low", "Listing Agent"],
    ["Send Listing Paperwork to Client", "High", "Admin"],
    ["Send Listing Paperwork to Office", "High", "Admin"],
    ["Send Preliminary Title to Office", "High", "Admin"],
    ["Download MLS & Save in File", "High", "Admin"],
    ["Verify Listing Docs Uploaded to MLS", "High", "Admin"],
    ["Update Client Status Sheet", "Medium", "Admin"],
    ["Create Email Documents Folder", "Medium", "Admin"],
    ["Add Documents to Email Documents Folder", "Medium", "Admin"],
  ]},
  { section: "Open Houses + Offer Review", tasks: [
    ["Broker Open", "Medium", "Listing Agent"],
    ["Open House #1", "Medium", "Listing Agent"],
    ["Open House #2", "Medium", "Listing Agent"],
    ["Offers Reviewed", "High", "Listing Agent"],
    ["Mutual Acceptance Date", "High", "Listing Agent"],
    ["Sales Price Confirmed", "High", "Listing Agent"],
    ["Purchase & Sale Closing Date Set", "High", "Transaction Coordinator"],
    ["Mutual Acceptance Procedure Reviewed", "High", "Transaction Coordinator"],
  ]},
  { section: "Pending to Closing", tasks: [
    ["De-Staging Date Requested", "Medium", "Admin"],
    ["De-Staging Scheduled", "Medium", "Admin"],
    ["Appraisal Date Set", "High", "Transaction Coordinator"],
    ["Appraisal Amount Confirmed", "High", "Transaction Coordinator"],
    ["Sign Removal Requested", "Medium", "Admin"],
    ["Sign Removed", "Medium", "Admin"],
    ["Contractor Box Pick-Up", "Low", "Admin"],
    ["Final File Audit", "High", "Transaction Coordinator"],
  ]},
  { section: "Notes & Communication", tasks: [
    ["Staging Removal Note Sent", "Medium", "Admin"],
    ["Stager Confirmation Received", "Medium", "Admin"],
    ["Client Communication Log Updated", "Medium", "Admin"],
    ["Closing Reminders Sent", "High", "Transaction Coordinator"],
  ]},
];

const STAGES = ["Listing Signed", "Prep", "Photos", "MLS Live", "Pending", "Closed"];
const STORE_KEY = "listing-tracker-v1";

function uid() { return Math.random().toString(36).slice(2, 10); }

function freshChecklist() {
  const list = [];
  CHECKLIST_TEMPLATE.forEach(sec => {
    sec.tasks.forEach(([name, priority, owner]) => {
      list.push({ id: uid(), section: sec.section, name, priority, owner, done: false });
    });
  });
  return list;
}

function freshListing(overrides) {
  return Object.assign({
    id: uid(),
    property: "",
    seller: "",
    mls: "",
    listPrice: "",
    goLive: "",
    openHouse1: "",
    openHouse2: "",
    mutualAcceptance: "",
    appraisalDate: "",
    closingDate: "",
    stage: "Listing Signed",
    notes: "",
    vendors: [],
    checklist: freshChecklist(),
  }, overrides || {});
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted or unavailable — fall through to defaults */ }
  return {
    teamName: "Casa",
    theme: "light",
    view: { screen: "dashboard", listingId: null },
    listings: [
      freshListing({
        property: "123 Example St, Sample City",
        seller: "Sample Seller (delete this listing to start fresh)",
        mls: "",
        listPrice: "",
      })
    ],
  };
}

function migrateState(rawState) {
  const next = rawState || {};
  if (!next.teamName || next.teamName === "Your Real Estate Business") next.teamName = "Casa";
  if (next.theme !== "light" && next.theme !== "dark") next.theme = "light";
  if (!next.view || !next.view.screen) next.view = { screen: "dashboard", listingId: null };
  if (!Array.isArray(next.listings)) next.listings = [];
  next.listings = next.listings.map(l => Object.assign({
    id: uid(), property: "", seller: "", mls: "", listPrice: "",
    goLive: "", openHouse1: "", openHouse2: "", mutualAcceptance: "", appraisalDate: "", closingDate: "",
    stage: "Listing Signed", notes: "", vendors: [], checklist: freshChecklist(),
  }, l, {
    vendors: Array.isArray(l.vendors) ? l.vendors : [],
    checklist: Array.isArray(l.checklist) ? l.checklist : freshChecklist(),
  }));
  return next;
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { console.error("Could not save:", e); }
}

let state = migrateState(loadState());
saveState();

/* ---------- Derived helpers ---------- */
function progress(listing) {
  const total = listing.checklist.length;
  const done = listing.checklist.filter(t => t.done).length;
  return { total, done, open: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function stageColor(stage) {
  if (stage === "Closed") return { bg: "var(--accent-soft)", fg: "var(--accent)" };
  if (stage === "Pending") return { bg: "var(--blue-soft)", fg: "var(--blue)" };
  if (stage === "MLS Live") return { bg: "var(--yellow-soft)", fg: "var(--yellow)" };
  return { bg: "var(--surface-2)", fg: "var(--muted)" };
}

function esc(str) {
  return String(str || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* ---------- Rendering ---------- */
const app = document.getElementById("app");

function render() {
  if (state.theme !== "light" && state.theme !== "dark") state.theme = "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  if (state.view.screen === "detail") {
    app.innerHTML = renderDetail(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "checklist") {
    app.innerHTML = renderChecklistScreen(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "timeline") {
    app.innerHTML = renderTimeline(state.listings.find(l => l.id === state.view.listingId));
  } else if (state.view.screen === "settings") {
    app.innerHTML = renderSettings();
  } else {
    app.innerHTML = renderDashboard();
  }
  bindEvents();
}

function renderTopbar() {
  return `
    <div class="promo-bar desktop-only">Every listing, one calm dashboard — <strong>Casa keeps your team in sync</strong></div>
    <div class="topbar">
      <div class="brand">
        <span class="brand-emoji">🏡</span>
        <div>
          <input class="brand-name-input" id="teamNameInput" value="${esc(state.teamName)}" />
          <div class="brand-sub">Listing workflow dashboard</div>
        </div>
      </div>
      <nav class="nav-links desktop-only">
        <span>Listings</span>
        <span>Checklist</span>
        <span>Timeline</span>
        <span>Settings</span>
      </nav>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme">${state.theme === "dark" ? "☀️" : "🌙"}</button>
      </div>
    </div>`;
}

function renderHero() {
  return `
    <div class="hero desktop-only">
      <div class="hero-copy">
        <div class="rating">★★★★★ Loved by listing teams</div>
        <h1>Every listing,<br/>on track.</h1>
        <p>Casa keeps pre-listing docs, staging, marketing, open houses, and closing tasks moving — so nothing falls through the cracks.</p>
        <div class="hero-actions">
          <button class="btn-primary" id="heroAddListingBtn">+ New Listing</button>
        </div>
      </div>
      <div class="device-card">
        <div class="seal">CASA<br/>VERIFIED</div>
        <div class="device-screen">
          <div class="screen-head">
            <div class="screen-title">Today</div>
            <span>🏡</span>
          </div>
          <div class="screen-grid">
            <div class="screen-tile">Docs</div>
            <div class="screen-tile">Prep</div>
            <div class="screen-tile">Marketing</div>
            <div class="screen-tile">Open House</div>
            <div class="screen-tile">Pending</div>
            <div class="screen-tile">Closed</div>
          </div>
        </div>
      </div>
    </div>`;
}

function renderDashboard() {
  const rows = state.listings.map(l => {
    const p = progress(l);
    const sc = stageColor(l.stage);
    return `
      <div class="listing-row" data-open="${l.id}">
        <div>
          <div class="listing-prop">${esc(l.property) || "Untitled listing"}</div>
          <div class="listing-sub">${esc(l.seller) || "No seller yet"}${l.listPrice ? " · " + esc(l.listPrice) : ""}</div>
        </div>
        <div><span class="stage-badge" style="background:${sc.bg}; color:${sc.fg}">${esc(l.stage)}</span></div>
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p.pct}%"></div></div>
          <div class="progress-label">${p.pct}% complete</div>
        </div>
        <div class="open-items">${p.open}<small>open items</small></div>
        <div><button class="icon-btn btn-sm" data-delete="${l.id}" title="Delete listing">✕</button></div>
      </div>`;
  }).join("");

  const body = state.listings.length
    ? `<div class="card">${rows}</div>`
    : `<div class="card empty-state"><div class="big">🏠</div>No listings yet. Add your first one to start tracking.</div>`;

  return `
    ${renderTopbar()}
    ${renderHero()}
    <div class="dashboard-head">
      <h2>Listings</h2>
      <button class="btn-primary" id="addListingBtn">+ New Listing</button>
    </div>
    ${body}
    ${renderBottomTabs()}
  `;
}

function renderChecklistSections(listing) {
  return CHECKLIST_TEMPLATE.map(sec => {
    const tasks = listing.checklist.filter(t => t.section === sec.section);
    const done = tasks.filter(t => t.done).length;
    const rows = tasks.map(t => `
      <div class="task-row ${t.done ? "done" : ""}">
        <input type="checkbox" class="task-check" data-task="${t.id}" ${t.done ? "checked" : ""} />
        <div>
          <div class="task-name ${t.done ? "strike" : ""}">${esc(t.name)}</div>
          <div class="task-tags">
            <span class="tag tag-priority-${t.priority.toLowerCase()}">${esc(t.priority)}</span>
            <span class="tag tag-owner">${esc(t.owner)}</span>
          </div>
        </div>
      </div>`).join("");
    return `
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title">${esc(sec.section)}</div>
          <div class="section-meta">${done}/${tasks.length} done</div>
        </div>
        <div class="task-list">${rows}</div>
      </div>`;
  }).join("");
}

function renderBottomTabs() {
  const active = state.view.screen;
  return `
    <nav class="mobile-bottom-tabs" aria-label="Mobile navigation">
      <button class="tab-btn ${active === "dashboard" ? "active" : ""}" data-tab="dashboard"><strong>🏠</strong>Dashboard</button>
      <button class="tab-btn ${active === "checklist" ? "active" : ""}" data-tab="checklist"><strong>✅</strong>Checklist</button>
      <button class="tab-btn ${active === "timeline" ? "active" : ""}" data-tab="timeline"><strong>📅</strong>Timeline</button>
      <button class="tab-btn ${active === "settings" ? "active" : ""}" data-tab="settings"><strong>⚙️</strong>Settings</button>
    </nav>`;
}

function renderDetail(listing) {
  if (!listing) { state.view = { screen: "dashboard", listingId: null }; return renderDashboard(); }
  const p = progress(listing);

  return `
    ${renderTopbar()}
    <button class="back-link" id="backBtn">← All listings</button>
    <div class="card detail-header">
      <input class="brand-name-input" style="font-size:22px;" id="propertyInput" value="${esc(listing.property)}" placeholder="Property address" />
      <div class="field-grid">
        <div class="field"><label>Seller(s)</label><input id="f_seller" value="${esc(listing.seller)}" /></div>
        <div class="field"><label>MLS #</label><input id="f_mls" value="${esc(listing.mls)}" /></div>
        <div class="field"><label>List Price</label><input id="f_listPrice" value="${esc(listing.listPrice)}" /></div>
        <div class="field"><label>Go-Live Date</label><input id="f_goLive" value="${esc(listing.goLive)}" placeholder="MM/DD/YYYY" /></div>
        <div class="field"><label>Open House #1</label><input id="f_openHouse1" value="${esc(listing.openHouse1)}" placeholder="MM/DD/YYYY" /></div>
        <div class="field"><label>Open House #2</label><input id="f_openHouse2" value="${esc(listing.openHouse2)}" placeholder="MM/DD/YYYY" /></div>
        <div class="field"><label>Mutual Acceptance</label><input id="f_mutualAcceptance" value="${esc(listing.mutualAcceptance)}" placeholder="MM/DD/YYYY" /></div>
        <div class="field"><label>Appraisal Date</label><input id="f_appraisalDate" value="${esc(listing.appraisalDate)}" placeholder="MM/DD/YYYY" /></div>
        <div class="field"><label>Closing Date</label><input id="f_closingDate" value="${esc(listing.closingDate)}" placeholder="MM/DD/YYYY" /></div>
      </div>

      <div class="stage-stepper">
        ${STAGES.map((s, i) => {
          const curIdx = STAGES.indexOf(listing.stage);
          const cls = s === listing.stage ? "current" : (i < curIdx ? "done" : "");
          return `<button class="stage-pill ${cls}" data-stage="${esc(s)}">${esc(s)}</button>`;
        }).join("")}
      </div>

      <div class="summary-row">
        <div class="summary-item"><div class="summary-num">${p.pct}%</div><div class="summary-cap">Complete</div></div>
        <div class="summary-item"><div class="summary-num">${p.open}</div><div class="summary-cap">Open items</div></div>
        <div class="summary-item"><div class="summary-num">${p.done}/${p.total}</div><div class="summary-cap">Tasks done</div></div>
      </div>
    </div>

    <div class="desktop-only">${renderChecklistSections(listing)}</div>

    <div class="card notes-card">
      <div class="field"><label>Notes</label>
        <textarea id="f_notes" placeholder="Communication log, anything worth remembering...">${esc(listing.notes)}</textarea>
      </div>
    </div>
    ${renderBottomTabs()}
  `;
}

function renderListingScopedEmpty(screenName) {
  return `
    ${renderTopbar()}
    <div class="card empty-state"><div class="big">🏠</div>Select a listing first to view its ${screenName}.</div>
    ${renderBottomTabs()}
  `;
}

function renderChecklistScreen(listing) {
  if (!listing) return renderListingScopedEmpty("checklist");
  return `
    ${renderTopbar()}
    <button class="back-link" id="backBtn">← All listings</button>
    <div class="toolbar"><h2>✅ Checklist</h2><span class="sub">${esc(listing.property) || "Untitled listing"}</span></div>
    ${renderChecklistSections(listing)}
    ${renderBottomTabs()}
  `;
}

function renderTimeline(listing) {
  if (!listing) return renderListingScopedEmpty("timeline");
  const events = [
    ["Go-Live", listing.goLive],
    ["Open House #1", listing.openHouse1],
    ["Open House #2", listing.openHouse2],
    ["Mutual Acceptance", listing.mutualAcceptance],
    ["Appraisal", listing.appraisalDate],
    ["Closing", listing.closingDate],
  ];
  const rows = events.map(([name, date]) => `
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div><div class="timeline-title">${esc(name)}</div><div class="timeline-date">${esc(date) || "No date set"}</div></div>
    </div>`).join("");
  return `
    ${renderTopbar()}
    <button class="back-link" id="backBtn">← All listings</button>
    <div class="toolbar"><h2>📅 Timeline</h2><span class="sub">${esc(listing.property) || "Untitled listing"}</span></div>
    <div class="card timeline-list">${rows}</div>
    ${renderBottomTabs()}
  `;
}

function renderSettings() {
  const listing = currentListing();
  const vendorRows = listing && listing.vendors.length ? listing.vendors.map(v => `
    <div class="task-row">
      <div style="flex:1;">
        <div class="task-name">${esc(v.name) || "Unnamed vendor"}</div>
        <div class="task-tags"><span class="tag tag-owner">${esc(v.role) || "Role"}</span><span class="tag tag-owner">${esc(v.contact) || "No contact"}</span></div>
      </div>
      <button class="icon-btn btn-sm" data-vendor-delete="${esc(v.id)}">✕</button>
    </div>`).join("") : `<div class="empty-state" style="padding:24px;">${listing ? "No vendors yet." : "Open a listing to add vendors and listing notes."}</div>`;
  return `
    ${renderTopbar()}
    <div class="toolbar"><h2>⚙️ Settings</h2></div>
    <div class="card notes-card">
      <div class="field"><label>Team Name</label><input id="settingsTeamName" value="${esc(state.teamName)}" /></div>
      <button class="btn-ghost" id="settingsThemeToggle">${state.theme === "dark" ? "Switch to Light Mode" : "Switch to Dark Mode"}</button>
    </div>
    <div class="card notes-card">
      <h3>Vendors & Notes</h3>
      <div class="sub">${listing ? esc(listing.property) || "Untitled listing" : "Listing-scoped section"}</div>
      <div class="field" style="margin-top:12px;"><label>Listing Notes</label><textarea id="settingsNotes" ${listing ? "" : "disabled"}>${listing ? esc(listing.notes) : ""}</textarea></div>
      <div class="vendor-row">
        <div class="field"><label>Name</label><input id="vendorName" ${listing ? "" : "disabled"} /></div>
        <div class="field"><label>Role</label><input id="vendorRole" ${listing ? "" : "disabled"} /></div>
        <div class="field"><label>Contact</label><input id="vendorContact" ${listing ? "" : "disabled"} /></div>
        <button class="btn-primary" id="addVendorBtn" ${listing ? "" : "disabled"}>Add</button>
      </div>
      <div class="task-list" style="margin-top:14px;">${vendorRows}</div>
    </div>
    ${renderBottomTabs()}
  `;
}

/* ---------- Event binding ---------- */
function bindEvents() {
  const teamNameInput = document.getElementById("teamNameInput");
  if (teamNameInput) teamNameInput.addEventListener("change", e => { state.teamName = e.target.value; saveState(); });

  const themeToggle = document.getElementById("themeToggle");
  if (themeToggle) themeToggle.addEventListener("click", toggleTheme);

  const settingsThemeToggle = document.getElementById("settingsThemeToggle");
  if (settingsThemeToggle) settingsThemeToggle.addEventListener("click", toggleTheme);

  const settingsTeamName = document.getElementById("settingsTeamName");
  if (settingsTeamName) settingsTeamName.addEventListener("change", e => { state.teamName = e.target.value; saveState(); render(); });

  const settingsNotes = document.getElementById("settingsNotes");
  if (settingsNotes) settingsNotes.addEventListener("change", e => { const listing = currentListing(); if (listing) { listing.notes = e.target.value; saveState(); } });

  document.querySelectorAll("[data-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const tab = el.getAttribute("data-tab");
      if ((tab === "checklist" || tab === "timeline") && !currentListing()) {
        alert("Select a listing first.");
        state.view = { screen: "dashboard", listingId: null };
      } else if (tab === "dashboard") {
        state.view = { screen: "dashboard", listingId: null };
      } else {
        state.view = { screen: tab, listingId: state.view.listingId };
      }
      saveState(); render();
    });
  });

  const addBtn = document.getElementById("addListingBtn");
  if (addBtn) addBtn.addEventListener("click", openAddModal);

  const heroAddBtn = document.getElementById("heroAddListingBtn");
  if (heroAddBtn) heroAddBtn.addEventListener("click", openAddModal);

  document.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete]")) return;
      state.view = { screen: "detail", listingId: el.getAttribute("data-open") };
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-delete]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-delete");
      const listing = state.listings.find(l => l.id === id);
      if (confirm(`Delete "${listing.property || "this listing"}"? This can't be undone.`)) {
        state.listings = state.listings.filter(l => l.id !== id);
        saveState(); render();
      }
    });
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", () => {
    state.view = { screen: "dashboard", listingId: null };
    saveState(); render();
  });

  document.querySelectorAll(".task-check").forEach(el => {
    el.addEventListener("change", () => {
      const listing = currentListing();
      const task = listing.checklist.find(t => t.id === el.getAttribute("data-task"));
      task.done = el.checked;
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-stage]").forEach(el => {
    el.addEventListener("click", () => {
      currentListing().stage = el.getAttribute("data-stage");
      saveState(); render();
    });
  });

  bindFieldInput("propertyInput", "property");
  bindFieldInput("f_seller", "seller");
  bindFieldInput("f_mls", "mls");
  bindFieldInput("f_listPrice", "listPrice");
  bindFieldInput("f_goLive", "goLive");
  bindFieldInput("f_openHouse1", "openHouse1");
  bindFieldInput("f_openHouse2", "openHouse2");
  bindFieldInput("f_mutualAcceptance", "mutualAcceptance");
  bindFieldInput("f_appraisalDate", "appraisalDate");
  bindFieldInput("f_closingDate", "closingDate");
  bindFieldInput("f_notes", "notes");

  const addVendorBtn = document.getElementById("addVendorBtn");
  if (addVendorBtn) addVendorBtn.addEventListener("click", () => {
    const listing = currentListing();
    if (!listing) return;
    const name = document.getElementById("vendorName").value.trim();
    const role = document.getElementById("vendorRole").value.trim();
    const contact = document.getElementById("vendorContact").value.trim();
    if (!name && !role && !contact) return;
    listing.vendors.push({ id: uid(), name, role, contact });
    saveState(); render();
  });

  document.querySelectorAll("[data-vendor-delete]").forEach(el => {
    el.addEventListener("click", () => {
      const listing = currentListing();
      if (!listing) return;
      listing.vendors = listing.vendors.filter(v => v.id !== el.getAttribute("data-vendor-delete"));
      saveState(); render();
    });
  });
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveState(); render();
}

function bindFieldInput(elId, key) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.addEventListener("change", () => {
    currentListing()[key] = el.value;
    saveState();
  });
}

function currentListing() {
  return state.listings.find(l => l.id === state.view.listingId);
}

/* ---------- Add listing modal ---------- */
function openAddModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="card modal">
      <h3>New Listing</h3>
      <div class="sub">Starts with the full pre-listing-to-closing checklist.</div>
      <div class="field"><label>Property Address</label><input id="m_property" placeholder="123 Main St, City" /></div>
      <div class="field"><label>Seller(s)</label><input id="m_seller" placeholder="Jane & John Smith" /></div>
      <div class="field"><label>MLS #</label><input id="m_mls" /></div>
      <div class="field"><label>List Price</label><input id="m_listPrice" placeholder="$650,000" /></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="m_cancel">Cancel</button>
        <button class="btn-primary" id="m_create">Create Listing</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById("m_cancel").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("m_create").addEventListener("click", () => {
    const property = document.getElementById("m_property").value.trim();
    const listing = freshListing({
      property,
      seller: document.getElementById("m_seller").value.trim(),
      mls: document.getElementById("m_mls").value.trim(),
      listPrice: document.getElementById("m_listPrice").value.trim(),
    });
    state.listings.unshift(listing);
    state.view = { screen: "detail", listingId: listing.id };
    saveState();
    overlay.remove();
    render();
  });
}

render();
</script>
</body>
</html>
